name: Keep Neon Awake

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  ping-neon:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Neon Database
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          echo "Testing connection to Neon database..."
          # Remove channel_binding parameter which can cause issues
          CLEAN_URL=$(echo "$NEON_DB_URL" | sed 's/&channel_binding=require//g')
          psql "$CLEAN_URL" -c 'SELECT 1 as ping_result;' && echo "✅ Neon database ping successful!"
