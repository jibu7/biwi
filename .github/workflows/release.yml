name: Release & Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      version:
        description: 'Version to deploy'
        required: true
        default: 'latest'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    outputs:
      backend-tag: ${{ steps.backend-meta.outputs.tags }}
      frontend-tag: ${{ steps.frontend-meta.outputs.tags }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Backend Build
    - name: Extract backend metadata
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/vinea-erp-backend
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./docker/Dockerfile.backend
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Frontend Build
    - name: Extract frontend metadata
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/vinea-erp-frontend
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./docker/Dockerfile.frontend
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'staging' || (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease)
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        echo "Backend image: ${{ needs.build-and-test.outputs.backend-tag }}"
        echo "Frontend image: ${{ needs.build-and-test.outputs.frontend-tag }}"
        
        # Example deployment commands:
        # kubectl set image deployment/backend-deployment backend=${{ needs.build-and-test.outputs.backend-tag }}
        # kubectl set image deployment/frontend-deployment frontend=${{ needs.build-and-test.outputs.frontend-tag }}
        # kubectl rollout status deployment/backend-deployment
        # kubectl rollout status deployment/frontend-deployment

    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging"
        # Add your staging smoke tests here
        # curl -f https://staging.vinea-erp.com/health
        # curl -f https://staging.vinea-erp.com/api/v1/health

    - name: Notify staging deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: 'Staging deployment completed'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'production' || (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease)
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment"
        echo "Backend image: ${{ needs.build-and-test.outputs.backend-tag }}"
        echo "Frontend image: ${{ needs.build-and-test.outputs.frontend-tag }}"
        
        # Example production deployment with blue-green strategy:
        # kubectl apply -f k8s/production/
        # kubectl set image deployment/backend-deployment backend=${{ needs.build-and-test.outputs.backend-tag }}
        # kubectl set image deployment/frontend-deployment frontend=${{ needs.build-and-test.outputs.frontend-tag }}
        # kubectl rollout status deployment/backend-deployment --timeout=600s
        # kubectl rollout status deployment/frontend-deployment --timeout=600s

    - name: Run production smoke tests
      run: |
        echo "Running production smoke tests"
        # Add your production smoke tests here
        # curl -f https://vinea-erp.com/health
        # curl -f https://vinea-erp.com/api/v1/health

    - name: Update release notes
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          CHANGELOG.md
        append_body: |
          
          ## Deployment Information
          - Backend Image: ${{ needs.build-and-test.outputs.backend-tag }}
          - Frontend Image: ${{ needs.build-and-test.outputs.frontend-tag }}
          - Deployed at: ${{ github.event.head_commit.timestamp }}

    - name: Notify production deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: 'Production deployment completed'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    environment: production
    
    steps:
    - name: Rollback deployment
      run: |
        echo "Rolling back failed deployment"
        # Add rollback commands here
        # kubectl rollout undo deployment/backend-deployment
        # kubectl rollout undo deployment/frontend-deployment
