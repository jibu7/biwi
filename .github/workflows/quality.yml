name: Code Quality & Monitoring

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run quality checks weekly on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # SonarQube Analysis (only if secrets are available)
    # - name: SonarQube Scan
    #   if: false  # Disabled until SonarQube is configured
    #   uses: mr-smithers-excellent/sonarqube-quality-gate-action@v1
    #   timeout-minutes: 5
    #   env:
    #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    #   continue-on-error: true

    # Python Code Quality
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        cd backend
        poetry install --with dev

    - name: Run Python code quality checks
      run: |
        cd backend
        
        # Install quality tools
        poetry run pip install flake8 black isort || true
        
        # Code formatting (non-blocking)
        poetry run black --check --diff app/ || true
        poetry run isort --check-only --diff app/ || true
        
        # Linting (non-blocking)
        poetry run flake8 app/ --statistics || true

    # Node.js Code Quality
    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Node.js code quality checks
      run: |
        cd frontend
        
        # Linting (allow warnings)
        npm run lint -- --max-warnings=1000 || true
        
        # Type checking
        npx tsc --noEmit || true

    - name: Summary
      run: |
        echo "Code quality checks completed"
        echo "Frontend linting: $(cd frontend && npm run lint -- --max-warnings=1000 && echo 'PASSED' || echo 'WARNINGS')"
        echo "TypeScript check: $(cd frontend && npx tsc --noEmit && echo 'PASSED' || echo 'ISSUES')"

  performance-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        cd backend
        poetry install --with dev
        poetry run pip install locust

    - name: Set up environment
      run: |
        cd backend
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" > .env
        echo "SECRET_KEY=test-secret-key-for-performance" >> .env

    - name: Run database migrations
      run: |
        cd backend
        poetry run alembic upgrade head

    - name: Start backend server
      run: |
        cd backend
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10

    - name: Run performance tests
      run: |
        cd backend
        poetry run locust --headless --users 10 --spawn-rate 2 --run-time 30s --host http://localhost:8000 --html performance-report.html

    - name: Upload performance reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports
        path: backend/performance-report.html

  documentation:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install documentation dependencies
      run: |
        cd backend
        poetry install --with dev
        poetry run pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints

    - name: Generate API documentation
      run: |
        cd backend
        mkdir -p docs/api
        poetry run python -c "import json; from app.main import app; json.dump(app.openapi(), open('docs/api/openapi.json', 'w'), indent=2)"

    - name: Build Sphinx documentation
      run: |
        cd backend
        if [ -f "docs/conf.py" ]; then
          poetry run sphinx-build -b html docs docs/_build/html
        fi

    # GitHub Pages deployment disabled until Pages is properly configured
    # - name: Deploy to GitHub Pages
    #   uses: peaceiris/actions-gh-pages@v3
    #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    #   with:
    #     github_token: ${{ secrets.GITHUB_TOKEN }}
    #     publish_dir: ./backend/docs/_build/html

  accessibility-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build application
      run: |
        cd frontend
        npm run build

    - name: Start application
      run: |
        cd frontend
        npm start &
        sleep 10

    - name: Run accessibility tests
      run: |
        npm install -g @axe-core/cli
        axe http://localhost:3000 --save accessibility-report.json --tags wcag2a,wcag2aa

    - name: Upload accessibility report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: accessibility-report
        path: accessibility-report.json
