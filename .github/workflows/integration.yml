name: Full-Stack Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  POETRY_VERSION: '1.8.0'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend Setup
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/pyproject.toml') }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install backend dependencies
      run: |
        cd backend
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true
        poetry install --with dev

    # Frontend Setup
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    # Environment Setup
    - name: Set up environment variables
      run: |
        cd backend
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" > .env
        echo "SECRET_KEY=test-secret-key-for-integration" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
        echo "CORS_ORIGINS=http://localhost:3000" >> .env

    - name: Run database migrations
      run: |
        cd backend
        poetry run alembic upgrade head

    # Start Services
    - name: Start backend server
      run: |
        cd backend
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        curl -f http://localhost:8000/health || exit 1

    - name: Build frontend
      run: |
        cd frontend
        NEXT_PUBLIC_API_URL=http://localhost:8000 npm run build

    - name: Start frontend server
      run: |
        cd frontend
        npm start &
        sleep 10
        curl -f http://localhost:3000 || exit 1

    # Run Integration Tests
    - name: Run API integration tests
      run: |
        cd backend
        poetry run pytest tests/integration/ -v --tb=short

    - name: Run end-to-end tests
      run: |
        cd frontend
        npx playwright install chromium
        npx playwright test --reporter=line

    # Health Checks
    - name: Check service health
      run: |
        echo "Checking backend health..."
        curl -f http://localhost:8000/docs
        echo "Checking frontend health..."
        curl -f http://localhost:3000

  docker-compose-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        docker compose version

    - name: Create environment files
      run: |
        echo "DATABASE_URL=postgresql://postgres:password@db:5432/vinea_erp" > backend/.env
        echo "SECRET_KEY=test-secret-key-for-docker" >> backend/.env
        echo "ALGORITHM=HS256" >> backend/.env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> backend/.env
        echo "NEXT_PUBLIC_API_URL=http://localhost:8000" > frontend/.env.local

    - name: Build and start services
      run: |
        docker compose up -d --build

    - name: Wait for services to be ready
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:8000/health; do sleep 5; done'
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 5; done'

    - name: Run database migrations
      run: |
        docker compose exec -T backend poetry run alembic upgrade head

    - name: Run basic smoke tests
      run: |
        # Test API endpoints
        curl -f http://localhost:8000/docs
        curl -f http://localhost:8000/api/v1/auth/health
        
        # Test frontend
        curl -f http://localhost:3000

    - name: Show logs on failure
      if: failure()
      run: |
        docker compose logs backend
        docker compose logs frontend
        docker compose logs db

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v
